<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>D.M. Company — Calculateur VTC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #242424 0%, #0b0b0b 45%, #000 100%);
      color: #fff;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 18px 45px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #d4af37;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 12px;
      letter-spacing: 3px;
      color: #ddd;
    }

    .card {
      background: rgba(20, 20, 20, 0.96);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.45);
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #d4af37;
      letter-spacing: 0.4px;
    }

    input,
    select {
      width: 100%;
      height: 52px;
      border-radius: 12px;
      border: 1px solid #555;
      background: #101010;
      color: #fff;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 2px rgba(212,175,55,0.12);
    }

    /* Google autocomplete */
    .autocomplete-box {
      width: 100%;
      min-height: 52px;
      background: #101010;
      border-radius: 12px;
    }

    place-autocomplete-element {
      display: block;
      width: 100%;
    }

    .calculate {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #d4af37, #b68d22);
      color: #000;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 5px;
    }

    .calculate:active {
      transform: scale(0.99);
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 18px;
      color: #d4af37;
      font-size: 14px;
    }

    .error {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      background: #321313;
      border: 1px solid #8f3a3a;
      color: #ffd6d6;
      font-size: 14px;
      line-height: 1.4;
    }

    .result {
      display: none;
      margin-top: 24px;
      border-top: 1px solid rgba(212,175,55,0.35);
      padding-top: 22px;
    }

    .result-title {
      text-align: center;
      color: #d4af37;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 18px;
    }

    .summary {
      background: #0c0c0c;
      border-radius: 14px;
      padding: 16px;
      border: 1px solid #292929;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 0;
      border-bottom: 1px solid #222;
      font-size: 14px;
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .summary-label {
      color: #aaa;
      flex: 0 0 105px;
    }

    .summary-value {
      color: #fff;
      text-align: right;
      word-break: break-word;
    }

    .price-box {
      text-align: center;
      margin-top: 20px;
      padding: 20px;
      border: 1px solid rgba(212,175,55,0.45);
      border-radius: 15px;
      background: linear-gradient(
        145deg,
        rgba(212,175,55,0.10),
        rgba(0,0,0,0.2)
      );
    }

    .price-label {
      font-size: 12px;
      color: #bbb;
      letter-spacing: 2px;
    }

    .price {
      margin-top: 8px;
      font-size: 38px;
      font-weight: 900;
      color: #d4af37;
    }

    .rate {
      margin-top: 5px;
      font-size: 12px;
      color: #888;
    }

    .reserve {
      width: 100%;
      height: 52px;
      margin-top: 18px;
      border-radius: 13px;
      border: 1px solid #d4af37;
      background: transparent;
      color: #d4af37;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
    }

    .reserve:hover {
      background: #d4af37;
      color: #000;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 11px;
      color: #777;
      line-height: 1.5;
    }

    @media (max-width: 400px) {
      .page {
        padding: 22px 13px 35px;
      }

      .card {
        padding: 18px;
      }

      .brand {
        font-size: 26px;
      }

      .price {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="header">
      <div class="brand">D.M. COMPANY</div>
      <div class="subtitle">VTC PREMIUM</div>
    </div>

    <div class="card">

      <div class="field">
        <label>📍 DÉPART</label>
        <div class="autocomplete-box" id="departureBox"></div>
      </div>

      <div class="field">
        <label>📍 DESTINATION</label>
        <div class="autocomplete-box" id="destinationBox"></div>
      </div>

      <div class="field">
        <label>📅 DATE</label>
        <input type="date" id="date">
      </div>

      <div class="field">
        <label>🕐 HEURE</label>
        <input type="time" id="time">
      </div>

      <div class="field">
        <label>👤 NOMBRE DE PASSAGERS</label>
        <select id="passengers">
          <option value="1">1 passager</option>
          <option value="2">2 passagers</option>
          <option value="3">3 passagers</option>
          <option value="4">4 passagers</option>
          <option value="5">5 passagers</option>
          <option value="6">6 passagers</option>
          <option value="7">7 passagers</option>
        </select>
      </div>

      <button class="calculate" id="calculateBtn">
        CALCULER LE PRIX
      </button>

      <div class="loading" id="loading">
        Calcul de votre trajet...
      </div>

      <div class="error" id="error"></div>

      <div class="result" id="result">

        <div class="result-title">
          RÉSUMÉ DE VOTRE COURSE
        </div>

        <div class="summary">

          <div class="summary-row">
            <div class="summary-label">Départ</div>
            <div class="summary-value" id="summaryDeparture">—</div>
          </div>

          <div class="summary-row">
            <div class="summary-label">Destination</div>
            <div class="summary-value" id="summaryDestination">—</div>
          </div>

          <div class="summary-row">
            <div class="summary-label">Date</div>
            <div class="summary-value" id="summaryDate">—</div>
          </div>

          <div class="summary-row">
            <div class="summary-label">Heure</div>
            <div class="summary-value" id="summaryTime">—</div>
          </div>

          <div class="summary-row">
            <div class="summary-label">Passagers</div>
            <div class="summary-value" id="summaryPassengers">—</div>
          </div>

          <div class="summary-row">
            <div class="summary-label">Distance</div>
            <div class="summary-value" id="summaryDistance">—</div>
          </div>

        </div>

        <div class="price-box">
          <div class="price-label">
            PRIX ESTIMATIF
          </div>

          <div class="price" id="price">
            0,00 €
          </div>

          <div class="rate">
            Tarif D.M. Company : 2,50 € / km
          </div>
        </div>

        <button class="reserve" id="reserveBtn">
          RÉSERVER MAINTENANT
        </button>

      </div>

    </div>

    <div class="footer">
      D.M. Company — VTC Premium<br>
      Prix estimatif basé sur la distance routière.
    </div>

  </div>


  <script>

    /* =====================================================
       D.M. COMPANY
       TARIF
    ===================================================== */

    const TARIF_KM = 2.50;

    let departurePlace = null;
    let destinationPlace = null;


    /* =====================================================
       INITIALISATION GOOGLE MAPS
    ===================================================== */

    window.initMaps = async function () {

      try {

        const { PlaceAutocompleteElement } =
          await google.maps.importLibrary("places");

        /* -----------------------------
           DÉPART
        ----------------------------- */

        const departureAutocomplete =
          new PlaceAutocompleteElement();

        departureAutocomplete.placeholder =
          "Adresse de départ";

        departureAutocomplete.includedRegionCodes = ["fr"];

        document
          .getElementById("departureBox")
          .appendChild(departureAutocomplete);


        /* -----------------------------
           DESTINATION
        ----------------------------- */

        const destinationAutocomplete =
          new PlaceAutocompleteElement();

        destinationAutocomplete.placeholder =
          "Adresse de destination";

        destinationAutocomplete.includedRegionCodes = ["fr"];

        document
          .getElementById("destinationBox")
          .appendChild(destinationAutocomplete);


        /* -----------------------------
           SÉLECTION DÉPART
        ----------------------------- */

        departureAutocomplete.addEventListener(
          "gmp-select",
          async ({ placePrediction }) => {

            try {

              const place =
                placePrediction.toPlace();

              await place.fetchFields({
                fields: [
                  "displayName",
                  "formattedAddress",
                  "location"
                ]
              });

              departurePlace = place;

            } catch (error) {

              console.error(
                "Erreur départ :",
                error
              );

            }

          }
        );


        /* -----------------------------
           SÉLECTION DESTINATION
        ----------------------------- */

        destinationAutocomplete.addEventListener(
          "gmp-select",
          async ({ placePrediction }) => {

            try {

              const place =
                placePrediction.toPlace();

              await place.fetchFields({
                fields: [
                  "displayName",
                  "formattedAddress",
                  "location"
                ]
              });

              destinationPlace = place;

            } catch (error) {

              console.error(
                "Erreur destination :",
                error
              );

            }

          }
        );


      } catch (error) {

        console.error(
          "Google Maps n'a pas pu se charger :",
          error
        );

        showError(
          "Impossible de charger la recherche d'adresses Google. Vérifiez la configuration Google Maps."
        );

      }

    };


    /* =====================================================
       CALCUL
    ===================================================== */

    document
      .getElementById("calculateBtn")
      .addEventListener(
        "click",
        calculatePrice
      );


    async function calculatePrice() {

      hideError();

      const date =
        document.getElementById("date").value;

      const time =
        document.getElementById("time").value;

      const passengers =
        document.getElementById("passengers").value;


      /* Vérifications */

      if (!departurePlace) {

        showError(
          "Veuillez sélectionner une adresse de départ dans les suggestions Google."
        );

        return;
      }


      if (!destinationPlace) {

        showError(
          "Veuillez sélectionner une adresse de destination dans les suggestions Google."
        );

        return;
      }


      if (!date) {

        showError(
          "Veuillez choisir une date."
        );

        return;
      }


      if (!time) {

        showError(
          "Veuillez choisir une heure."
        );

        return;
      }


      /* Afficher chargement */

      const loading =
        document.getElementById("loading");

      loading.style.display = "block";


      try {

        const { Route } =
          await google.maps.importLibrary("routes");


        /* ---------------------------------
           CALCUL ROUTE
        --------------------------------- */

        const request = {

          origin: departurePlace,

          destination: destinationPlace,

          travelMode: "DRIVING",

          language: "fr",

          units: google.maps.UnitSystem.METRIC,

          fields: [
            "distanceMeters"
          ]

        };


        const result =
          await Route.computeRoutes(request);


        if (
          !result.routes ||
          result.routes.length === 0
        ) {

          throw new Error(
            "Aucun itinéraire trouvé."
          );

        }


        const route =
          result.routes[0];


        const distanceMeters =
          route.distanceMeters;


        if (
          typeof distanceMeters !== "number" ||
          distanceMeters <= 0
        ) {

          throw new Error(
            "Distance impossible à déterminer."
          );

        }


        /* ---------------------------------
           DISTANCE
        --------------------------------- */

        const distanceKm =
          distanceMeters / 1000;


        /* ---------------------------------
           PRIX
        --------------------------------- */

        const total =
          distanceKm * TARIF_KM;


        /* ---------------------------------
           AFFICHER RÉSUMÉ
        --------------------------------- */

        document.getElementById(
          "summaryDeparture"
        ).textContent =
          departurePlace.formattedAddress ||
          departurePlace.displayName ||
          "—";


        document.getElementById(
          "summaryDestination"
        ).textContent =
          destinationPlace.formattedAddress ||
          destinationPlace.displayName ||
          "—";


        document.getElementById(
          "summaryDate"
        ).textContent =
          formatDate(date);


        document.getElementById(
          "summaryTime"
        ).textContent =
          time;


        document.getElementById(
          "summaryPassengers"
        ).textContent =
          passengers +
          (
            passengers === "1"
              ? " passager"
              : " passagers"
          );


        document.getElementById(
          "summaryDistance"
        ).textContent =
          distanceKm.toFixed(1)
            .replace(".", ",") +
          " km";


        document.getElementById(
          "price"
        ).textContent =
          formatEuro(total);


        document.getElementById(
          "result"
        ).style.display = "block";


        /* Aller au résultat */

        document.getElementById(
          "result"
        ).scrollIntoView({
          behavior: "smooth",
          block: "start"
        });


      } catch (error) {

        console.error(
          "Erreur calcul itinéraire :",
          error
        );

        showError(
          "Impossible de calculer cet itinéraire. Vérifiez les deux adresses puis réessayez."
        );

      } finally {

        loading.style.display = "none";

      }

    }


    /* =====================================================
       DATE
    ===================================================== */

    function formatDate(dateString) {

      const parts =
        dateString.split("-");

      if (parts.length !== 3) {
        return dateString;
      }

      return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
      );

    }


    /* =====================================================
       EURO
    ===================================================== */

    function formatEuro(value) {

      return value
        .toFixed(2)
        .replace(".", ",") +
        " €";

    }


    /* =====================================================
       ERREUR
    ===================================================== */

    function showError(message) {

      const error =
        document.getElementById("error");

      error.textContent = message;

      error.style.display = "block";

    }


    function hideError() {

      document.getElementById(
        "error"
      ).style.display = "none";

    }


    /* =====================================================
       RÉSERVER
    ===================================================== */

    document
      .getElementById("reserveBtn")
      .addEventListener(
        "click",
        function () {

          alert(
            "Votre demande de réservation est prête.\n\n" +
            "D.M. Company vous contactera pour confirmer la course."
          );

        }
      );

  </script>


  <!-- =====================================================
       GOOGLE MAPS JAVASCRIPT API
  
  ====================================================== -->

  <script
    async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA4kab5FyuqPAKrpS4rLx3ZE5mLLfTjCaE&loading=async&callback=initMaps">
  </script>

</body>
</html>
