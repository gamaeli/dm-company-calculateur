<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="D.M. Company">
<meta name="theme-color" content="#090909">

<title>D.M. Company - Calculateur VTC</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090909;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px 15px 40px;
}

.header {
  text-align: center;
  padding: 15px 0 22px;
  border-bottom: 1px solid #333;
  margin-bottom: 20px;
}

.logo {
  width: 78px;
  height: 78px;
  margin: auto;
  border: 2px solid #c89b3c;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #c89b3c;
  font-size: 28px;
  font-weight: bold;
}

h1 {
  color: #c89b3c;
  margin: 10px 0 4px;
  letter-spacing: 2px;
  font-size: 25px;
}

.subtitle {
  color: #aaa;
  font-size: 11px;
  letter-spacing: 2px;
}

.card {
  background: #171717;
  border: 1px solid #333;
  border-radius: 20px;
  padding: 18px;
}

.field {
  margin-bottom: 15px;
}

label {
  display: block;
  color: #bbb;
  font-size: 13px;
  margin-bottom: 7px;
}

input,
select {
  width: 100%;
  height: 50px;
  padding: 0 13px;
  border-radius: 11px;
  border: 1px solid #444;
  background: #0b0b0b;
  color: white;
  font-size: 16px;
}

input:focus,
select:focus {
  outline: none;
  border-color: #c89b3c;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

button {
  width: 100%;
  min-height: 52px;
  margin-top: 8px;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.calculate {
  background: #c89b3c;
  color: #111;
  margin-top: 5px;
}

.reserve {
  background: #292929;
  color: white;
  border: 1px solid #555;
}

.result {
  display: none;
  margin-top: 18px;
  padding: 22px 18px;
  background: #070707;
  border: 1px solid #3a3a3a;
  border-radius: 16px;
  text-align: center;
}

.result-title {
  color: #aaa;
  font-size: 11px;
  letter-spacing: 2px;
}

.price {
  color: #c89b3c;
  font-size: 44px;
  font-weight: 900;
  margin: 6px 0 10px;
}

.result-message {
  color: #aaa;
  font-size: 12px;
  line-height: 1.5;
}

.info {
  text-align: center;
  color: #777;
  font-size: 11px;
  margin-top: 18px;
  line-height: 1.5;
}

@media(max-width:430px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .price {
    font-size: 40px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">DM</div>

    <h1>D.M. COMPANY</h1>

    <div class="subtitle">
      VTC PREMIUM
    </div>
  </div>

  <div class="card">

    <div class="field">
      <label>📍 Départ</label>
      <input
        id="departure"
        type="text"
        placeholder="Adresse de départ">
    </div>

    <div class="field">
      <label>📍 Destination</label>
      <input
        id="destination"
        type="text"
        placeholder="Adresse de destination">
    </div>

    <div class="grid">

      <div class="field">
        <label>📅 Date</label>
        <input id="date" type="date">
      </div>

      <div class="field">
        <label>🕐 Heure</label>
        <input id="time" type="time">
      </div>

    </div>

    <div class="field">
      <label>👤 Nombre de passagers</label>

      <select id="passengers">
        <option value="1">1 passager</option>
        <option value="2">2 passagers</option>
        <option value="3">3 passagers</option>
        <option value="4">4 passagers</option>
        <option value="5">5 passagers</option>
        <option value="6">6 passagers</option>
      </select>
    </div>

    <div class="field">
      <label>🚗 Distance estimée (km)</label>

      <input
        id="km"
        type="number"
        inputmode="decimal"
        min="0"
        step="0.1"
        placeholder="Ex. 30">
    </div>

    <button
      class="calculate"
      onclick="calculatePrice()">
      CALCULER LE PRIX
    </button>

    <div
      class="result"
      id="result">

      <div class="result-title">
        PRIX ESTIMATIF
      </div>

      <div
        class="price"
        id="price">
        0,00 €
      </div>

      <div class="result-message">
        Estimation basée sur la distance indiquée.<br>
        Tarif D.M. Company : 2,50 € / km
      </div>

      <button
        class="reserve"
        onclick="reserve()">
        RÉSERVER MAINTENANT
      </button>

    </div>

    <div class="info">
      D.M. COMPANY · VTC PREMIUM<br>
      Le prix affiché est une estimation.
    </div>

  </div>

</div>

<script>

const TARIF_KM = 2.50;

function euros(number) {
  return number.toLocaleString("fr-FR", {
    style: "currency",
    currency: "EUR"
  });
}

function calculatePrice() {

  const km = parseFloat(
    document.getElementById("km").value
  ) || 0;

  if (km <= 0) {
    alert("Veuillez indiquer la distance en kilomètres.");
    return;
  }

  const total = km * TARIF_KM;

  document.getElementById("price").innerText =
    euros(total);

  document.getElementById("result").style.display =
    "block";

  document.getElementById("result").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}

function reserve() {

  const departure =
    document.getElementById("departure").value;

  const destination =
    document.getElementById("destination").value;

  const date =
    document.getElementById("date").value;

  const time =
    document.getElementById("time").value;

  const passengers =
    document.getElementById("passengers").value;

  const km =
    document.getElementById("km").value;

  if (!departure || !destination || !date || !time || !km) {
    alert(
      "Veuillez remplir le départ, la destination, la date, l'heure et la distance."
    );
    return;
  }

  alert(
    "Votre demande est prête à être finalisée.\n\n" +
    "Départ : " + departure + "\n" +
    "Destination : " + destination + "\n" +
    "Date : " + date + "\n" +
    "Heure : " + time + "\n" +
    "Passagers : " + passengers + "\n" +
    "Distance : " + km + " km"
  );
}

</script>

</body>
</html>
